version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Version-update PRs are off (and so are their emails); security updates still arrive.
    open-pull-requests-limit: 0
    groups:
      microsoft:
        patterns: ['Microsoft.*', 'System.*']
      testing:
        patterns: ['xunit*', 'AwesomeAssertions', 'coverlet*', 'Microsoft.NET.Test.Sdk']
    ignore:
      # 13+ requires a commercial licence; see README "Dependencies and Licensing".
      - dependency-name: MediatR
        versions: ['>= 13.0.0']

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
