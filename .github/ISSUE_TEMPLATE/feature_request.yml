name: Feature request
description: Propose a new capability or an API change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
      description: Sketch the usage you would like to write.
      render: csharp
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
